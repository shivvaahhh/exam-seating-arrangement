spring.application.name=smart-exam-seating
server.port=${PORT:8080}

# Spring Profiles: default uses H2. Use 'mysql' profile for MySQL database.
# spring.profiles.active=h2

# H2 Database Configuration (Default Development Fallback)
spring.datasource.url=jdbc:h2:mem:exam_seating_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# File Upload Configuration (for CSV student import)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Initial Admin Configuration
app.security.default-admin.username=admin
app.security.default-admin.password=admin123
app.security.default-admin.email=admin@college.edu

# Institution Name for Reports
app.institution.name=GOVERNMENT ENGINEERING COLLEGE
app.institution.tagline=Controller of Examinations - Autonomous System
app.institution.academic-year=2026-2027
