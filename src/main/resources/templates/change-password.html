<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - SMART EXAM SEAT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body {
            background: linear-gradient(135deg, #0f2b5c 0%, #1e3a8a 50%, #1e40af 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .password-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            width: 100%;
            max-width: 460px;
        }
        .card-header-custom {
            background: #0b1f42;
            color: #ffffff;
            padding: 2rem 2rem 1.5rem;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="password-card">
    <div class="card-header-custom">
        <div class="d-inline-flex p-3 rounded-circle bg-primary bg-opacity-25 mb-3">
            <i class="bi bi-shield-lock-fill text-warning fs-1"></i>
        </div>
        <h4 class="fw-bold m-0 tracking-wide">Change Password</h4>
        <small class="text-white-50">Set a secure password for your account</small>
    </div>

    <div class="p-4">
        <div th:if="${mustChangePassword}" class="alert alert-warning py-2 small" role="alert">
            <i class="bi bi-info-circle-fill me-1"></i>
            <strong>First Login Security Notice:</strong> You must change your initial temporary password before continuing.
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger py-2 small" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-1"></i>
            <span th:text="${errorMessage}">Error occurred</span>
        </div>

        <form th:action="@{/change-password}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="mb-3">
                <label for="currentPassword" class="form-label small fw-semibold text-muted">CURRENT PASSWORD</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-secondary"></i></span>
                    <input type="password" class="form-control border-start-0 border-end-0 ps-0" id="currentPassword" name="currentPassword" placeholder="Enter current password" required autofocus>
                    <button class="btn btn-outline-secondary border-start-0" type="button" onclick="togglePass('currentPassword', this)">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>

            <div class="mb-3">
                <label for="newPassword" class="form-label small fw-semibold text-muted">NEW PASSWORD (MIN 6 CHARACTERS)</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-key text-secondary"></i></span>
                    <input type="password" class="form-control border-start-0 border-end-0 ps-0" id="newPassword" name="newPassword" placeholder="Enter new password" minlength="6" required>
                    <button class="btn btn-outline-secondary border-start-0" type="button" onclick="togglePass('newPassword', this)">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>

            <div class="mb-4">
                <label for="confirmPassword" class="form-label small fw-semibold text-muted">CONFIRM NEW PASSWORD</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-check-lg text-secondary"></i></span>
                    <input type="password" class="form-control border-start-0 border-end-0 ps-0" id="confirmPassword" name="confirmPassword" placeholder="Re-enter new password" minlength="6" required>
                    <button class="btn btn-outline-secondary border-start-0" type="button" onclick="togglePass('confirmPassword', this)">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>

            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary btn-lg fw-semibold fs-6 py-2">
                    <i class="bi bi-check-circle me-1"></i> Update Password
                </button>
            </div>
        </form>

        <div class="text-center mt-3">
            <form th:action="@{/logout}" method="post" class="d-inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" class="btn btn-link text-muted small p-0 text-decoration-none">
                    <i class="bi bi-box-arrow-right me-1"></i> Cancel and Sign Out
                </button>
            </form>
        </div>
    </div>
</div>

<script>
    function togglePass(inputId, btn) {
        const input = document.getElementById(inputId);
        const icon = btn.querySelector('i');
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.remove('bi-eye');
            icon.classList.add('bi-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.remove('bi-eye-slash');
            icon.classList.add('bi-eye');
        }
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
