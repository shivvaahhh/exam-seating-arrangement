<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${isNew ? 'New Invigilator' : 'Edit Invigilator'})}"></head>
<body>

<div class="container-fluid p-0">
    <div class="row g-0">
        <!-- Sidebar -->
        <div th:replace="~{fragments/layout :: adminSidebar('invigilators')}"></div>

        <!-- Main Content -->
        <main class="col-lg-10 p-0">
            <div th:replace="~{fragments/layout :: topNavbar(${isNew ? 'Register Invigilator' : 'Edit Invigilator Profile'})}"></div>

            <div class="p-3 p-md-4">
                <div th:replace="~{fragments/layout :: alerts}"></div>

                <div class="card border-0 shadow-sm mx-auto" style="max-width: 680px;">
                    <div class="card-header bg-white py-3">
                        <div class="d-flex align-items-center justify-content-between">
                            <h5 class="fw-bold m-0" th:text="${isNew ? 'New Invigilator Form' : 'Update Invigilator Details'}">Form</h5>
                            <a th:href="@{/admin/invigilators}" class="btn btn-outline-secondary btn-sm">
                                <i class="bi bi-arrow-left me-1"></i> Back to Directory
                            </a>
                        </div>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="${isNew} ? @{/admin/invigilators/new} : @{'/admin/invigilators/' + ${invigilator.id} + '/edit'}"
                              th:object="${invigilator}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                            <div class="row g-3">
                                <div class="col-12 col-md-6">
                                    <label class="form-label small fw-semibold text-muted">EMPLOYEE / INVIGILATOR ID <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" th:field="*{employeeId}" placeholder="e.g. INV-001 or FAC-102" required>
                                    <div class="text-danger small" th:if="${#fields.hasErrors('employeeId')}" th:errors="*{employeeId}"></div>
                                </div>

                                <div class="col-12 col-md-6">
                                    <label class="form-label small fw-semibold text-muted">FULL NAME <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" th:field="*{name}" placeholder="e.g. Dr. Ramesh Kumar" required>
                                    <div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                                </div>

                                <div class="col-12 col-md-6">
                                    <label class="form-label small fw-semibold text-muted">EMAIL (USED FOR LOGIN) <span class="text-danger">*</span></label>
                                    <input type="email" class="form-control" th:field="*{email}" placeholder="e.g. ramesh.k@college.edu" required>
                                    <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                                    <small class="text-muted" th:if="${isNew}">An account with this email will be auto-generated.</small>
                                </div>

                                <div class="col-12 col-md-6">
                                    <label class="form-label small fw-semibold text-muted">CONTACT PHONE NUMBER</label>
                                    <input type="text" class="form-control" th:field="*{contact}" placeholder="e.g. 9876543210">
                                </div>

                                <div class="col-12 col-md-6">
                                    <label class="form-label small fw-semibold text-muted">PARENT DEPARTMENT</label>
                                    <select class="form-select" th:field="*{departmentId}">
                                        <option value="">-- No Department Assigned --</option>
                                        <option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.departmentName}">CSE</option>
                                    </select>
                                </div>

                                <div class="col-12 col-md-6">
                                    <label class="form-label small fw-semibold text-muted">ACTIVE STATUS</label>
                                    <select class="form-select" th:field="*{status}">
                                        <option value="ACTIVE">ACTIVE</option>
                                        <option value="INACTIVE">INACTIVE</option>
                                    </select>
                                </div>
                            </div>

                            <div class="alert alert-info py-2 small mt-4" th:if="${isNew}">
                                <i class="bi bi-shield-lock-fill me-1"></i>
                                <strong>Security Notice:</strong> A secure temporary password will be randomly generated and displayed to you upon submission. The invigilator will be forced to change it on their first login.
                            </div>

                            <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                                <a th:href="@{/admin/invigilators}" class="btn btn-outline-secondary">Cancel</a>
                                <button type="submit" class="btn btn-primary px-4 fw-semibold">
                                    <i class="bi bi-save me-1"></i> <span th:text="${isNew ? 'Create & Provision Account' : 'Save Changes'}">Submit</span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </main>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
