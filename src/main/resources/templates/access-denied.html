<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied - SMART EXAM SEAT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
    <div class="container text-center py-5">
        <div class="card shadow-sm border-0 p-5 mx-auto" style="max-width: 520px; border-radius: 12px;">
            <div class="text-danger mb-3">
                <i class="bi bi-shield-lock-fill" style="font-size: 4rem;"></i>
            </div>
            <h3 class="fw-bold text-dark">Access Denied</h3>
            <p class="text-muted mb-4">
                You do not have the required role or authorization level to view this examination portal resource.
            </p>
            <div class="d-flex justify-content-center gap-2">
                <a th:href="@{/}" class="btn btn-primary px-4">
                    <i class="bi bi-house-door-fill me-1"></i> Return Home
                </a>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn-outline-secondary px-4">
                        <i class="bi bi-box-arrow-right me-1"></i> Switch Account
                    </button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
