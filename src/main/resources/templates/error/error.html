<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - SMART EXAM SEAT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
    <div class="container text-center py-5">
        <div class="card shadow-sm border-0 p-5 mx-auto" style="max-width: 550px; border-radius: 12px;">
            <div class="text-warning mb-3">
                <i class="bi bi-exclamation-triangle-fill" style="font-size: 3.5rem;"></i>
            </div>
            <h1 class="display-4 fw-bold text-dark" th:text="${errorCode != null ? errorCode : 'Notice'}">404</h1>
            <h4 class="fw-semibold text-secondary mb-3" th:text="${errorTitle != null ? errorTitle : 'Application Notice'}">Notice</h4>
            <p class="text-muted mb-4" th:text="${errorMessage != null ? errorMessage : 'The requested resource could not be found or processed.'}">
                An error occurred while processing your request.
            </p>
            <div class="d-flex justify-content-center gap-2">
                <a href="javascript:history.back()" class="btn btn-outline-secondary px-4">
                    <i class="bi bi-arrow-left me-1"></i> Go Back
                </a>
                <a th:href="@{/}" class="btn btn-primary px-4">
                    <i class="bi bi-house-door-fill me-1"></i> Return Home
                </a>
            </div>
        </div>
    </div>
</body>
</html>
