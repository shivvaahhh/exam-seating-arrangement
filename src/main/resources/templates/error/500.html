<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - System Error</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
    <div class="container text-center py-5">
        <div class="card shadow-sm border-0 p-5 mx-auto" style="max-width: 520px; border-radius: 14px;">
            <div class="text-danger mb-3">
                <i class="bi bi-exclamation-octagon-fill" style="font-size: 4rem;"></i>
            </div>
            <h1 class="display-3 fw-bold text-dark">500</h1>
            <h4 class="fw-semibold text-secondary mb-3">Internal Server Error</h4>
            <p class="text-muted mb-4">
                An unexpected server error occurred while processing your request. Please try again or contact the examination cell administrator.
            </p>
            <div class="d-flex justify-content-center gap-2">
                <a href="javascript:history.back()" class="btn btn-outline-secondary px-4">
                    <i class="bi bi-arrow-left me-1"></i> Go Back
                </a>
                <a th:href="@{/}" class="btn btn-primary px-4">
                    <i class="bi bi-house-door-fill me-1"></i> Return Home
                </a>
            </div>
        </div>
    </div>
</body>
</html>
