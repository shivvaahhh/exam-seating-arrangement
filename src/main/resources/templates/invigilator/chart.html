<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Hall Seating Chart')}"></head>
<body>

<div class="container-fluid p-0">
    <div class="row g-0">
        <!-- Sidebar -->
        <div th:replace="~{fragments/layout :: invigilatorSidebar('dashboard')}"></div>

        <!-- Main Content -->
        <main class="col-lg-10 p-0">
            <div th:replace="~{fragments/layout :: topNavbar('Hall 2D Seating Chart')}"></div>

            <div class="p-3 p-md-4">
                <div th:replace="~{fragments/layout :: alerts}"></div>

                <!-- Printable Formal Header (Print Only) -->
                <div class="print-only mb-4 text-center border-bottom pb-3">
                    <h3 class="fw-bold m-0" th:text="${institutionName}">GOVERNMENT ENGINEERING COLLEGE</h3>
                    <div class="text-uppercase small text-muted" th:text="${institutionTagline}">Examination Cell</div>
                    <h5 class="fw-bold mt-2" th:text="${grid.examinationName}">Examination Name</h5>
                    <div class="small">
                        Date: <strong th:text="${grid.examDate}">2026-10-25</strong> |
                        Session: <strong th:text="${grid.examSession}">FORENOON</strong> |
                        Hall: <strong th:text="${grid.hallName + ' (' + grid.roomNumber + ')'}">Main Hall A</strong> |
                        Proctor: <strong th:text="${invigilator.name}">Dr. Ramesh</strong>
                    </div>
                </div>

                <!-- Header Actions (Screen Only) -->
                <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4 no-print">
                    <div>
                        <h4 class="fw-bold m-0 text-dark" th:text="${grid.hallName + ' - Seating Matrix'}">Main Hall A</h4>
                        <small class="text-muted" th:text="${grid.examinationName + ' | Room ' + grid.roomNumber + ' (' + grid.buildingName + ')'}">Exam details</small>
                    </div>
                    <div class="d-flex gap-2">
                        <a th:href="@{/invigilator/dashboard}" class="btn btn-outline-secondary btn-sm">
                            <i class="bi bi-arrow-left me-1"></i> My Duties
                        </a>
                        <button onclick="window.print()" class="btn btn-primary btn-sm">
                            <i class="bi bi-printer-fill me-1"></i> Print Chart
                        </button>
                    </div>
                </div>

                <!-- 2D Seating Grid Display -->
                <div class="card border-0 shadow-sm mb-4">
                    <div class="card-body p-3 p-md-4 text-center">
                        <!-- Podium / Blackboard representation -->
                        <div class="seat-podium mb-4">
                            <i class="bi bi-display me-2"></i> FRONT / PODIUM & BLACKBOARD
                        </div>

                        <!-- Grid -->
                        <div class="seat-grid-container d-inline-block text-center">
                            <div th:each="row : ${grid.gridRows}" class="d-flex justify-content-center align-items-center mb-2">
                                <span class="badge bg-secondary me-2 fw-bold text-white px-2 py-2" style="width: 32px;" th:text="${row.rowLetter}">A</span>
                                <div th:each="cell : ${row.seats}"
                                     th:class="${cell.status == 'OCCUPIED' ? 'seat-cell seat-occupied' : (cell.status == 'UNAVAILABLE' ? 'seat-cell seat-unavailable' : 'seat-cell seat-empty')}"
                                     th:title="${cell.status == 'OCCUPIED' ? cell.registerNumber + ' - ' + cell.studentName + ' (' + cell.departmentCode + ')' : cell.seatNumber}">
                                    <div class="fw-bold" style="font-size: 0.72rem;" th:text="${cell.seatNumber}">A-01</div>
                                    <div th:if="${cell.status == 'OCCUPIED'}" class="text-truncate px-1" style="font-size: 0.62rem;" th:text="${cell.registerNumber}">2024CSE001</div>
                                    <div th:if="${cell.status == 'EMPTY'}" class="text-muted" style="font-size: 0.6rem;">Empty</div>
                                    <div th:if="${cell.status == 'UNAVAILABLE'}" class="text-muted" style="font-size: 0.6rem;">N/A</div>
                                </div>
                            </div>
                        </div>

                        <!-- Legend -->
                        <div class="d-flex justify-content-center flex-wrap gap-4 mt-4 pt-3 border-top no-print">
                            <div class="seat-legend-item">
                                <div class="seat-legend-box seat-occupied"></div>
                                <span>Occupied Seat</span>
                            </div>
                            <div class="seat-legend-item">
                                <div class="seat-legend-box seat-empty"></div>
                                <span>Empty Usable Seat</span>
                            </div>
                            <div class="seat-legend-item">
                                <div class="seat-legend-box seat-unavailable"></div>
                                <span>Out of Bounds</span>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
