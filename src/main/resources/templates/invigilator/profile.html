<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Invigilator Profile')}"></head>
<body>

<div class="container-fluid p-0">
    <div class="row g-0">
        <!-- Sidebar -->
        <div th:replace="~{fragments/layout :: invigilatorSidebar('profile')}"></div>

        <!-- Main Content -->
        <main class="col-lg-10 p-0">
            <div th:replace="~{fragments/layout :: topNavbar('Invigilator Profile & Security')}"></div>

            <div class="p-3 p-md-4">
                <div th:replace="~{fragments/layout :: alerts}"></div>

                <div class="row g-4">
                    <!-- Profile Information -->
                    <div class="col-12 col-md-5">
                        <div class="card border-0 shadow-sm">
                            <div class="card-header bg-white py-3">
                                <h6 class="fw-bold m-0"><i class="bi bi-person-badge text-primary me-2"></i> Proctor Credentials</h6>
                            </div>
                            <div class="card-body p-4 text-center">
                                <div class="d-inline-flex p-3 rounded-circle bg-primary bg-opacity-10 text-primary fs-1 mb-3">
                                    <i class="bi bi-person-workspace"></i>
                                </div>
                                <h5 class="fw-bold text-dark m-0" th:text="${invigilator.name}">Dr. Ramesh</h5>
                                <div class="badge bg-primary bg-opacity-10 text-primary mt-1 mb-3">Faculty Invigilator</div>

                                <ul class="list-group list-group-flush text-start small">
                                    <li class="list-group-item d-flex justify-content-between px-0">
                                        <span class="text-muted">Employee ID:</span>
                                        <strong th:text="${invigilator.employeeId}">INV-001</strong>
                                    </li>
                                    <li class="list-group-item d-flex justify-content-between px-0">
                                        <span class="text-muted">Email (Username):</span>
                                        <strong th:text="${invigilator.email}">ramesh@college.edu</strong>
                                    </li>
                                    <li class="list-group-item d-flex justify-content-between px-0">
                                        <span class="text-muted">Contact:</span>
                                        <strong th:text="${invigilator.contact != null ? invigilator.contact : 'Not specified'}">9876543210</strong>
                                    </li>
                                    <li class="list-group-item d-flex justify-content-between px-0">
                                        <span class="text-muted">Department:</span>
                                        <strong th:text="${invigilator.department != null ? invigilator.department.departmentName : 'All Departments'}">CSE</strong>
                                    </li>
                                    <li class="list-group-item d-flex justify-content-between px-0">
                                        <span class="text-muted">Status:</span>
                                        <span class="badge bg-success bg-opacity-10 text-success">Active Duty</span>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>

                    <!-- Change Password Card -->
                    <div class="col-12 col-md-7">
                        <div class="card border-0 shadow-sm">
                            <div class="card-header bg-white py-3">
                                <h6 class="fw-bold m-0"><i class="bi bi-shield-lock text-warning me-2"></i> Update Password</h6>
                            </div>
                            <div class="card-body p-4">
                                <form th:action="@{/change-password}" method="post">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                                    <div class="mb-3">
                                        <label class="form-label small fw-semibold text-muted">CURRENT PASSWORD</label>
                                        <input type="password" name="currentPassword" class="form-control" placeholder="Enter current password" required>
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label small fw-semibold text-muted">NEW PASSWORD (MIN 6 CHARACTERS)</label>
                                        <input type="password" name="newPassword" class="form-control" placeholder="Enter new password" minlength="6" required>
                                    </div>

                                    <div class="mb-4">
                                        <label class="form-label small fw-semibold text-muted">CONFIRM NEW PASSWORD</label>
                                        <input type="password" name="confirmPassword" class="form-control" placeholder="Re-enter new password" minlength="6" required>
                                    </div>

                                    <button type="submit" class="btn btn-primary fw-semibold">
                                        <i class="bi bi-check-circle me-1"></i> Update My Password
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
