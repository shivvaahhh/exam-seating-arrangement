<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SMART EXAM SEAT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body {
            background: linear-gradient(135deg, #0f2b5c 0%, #1e3a8a 50%, #1e40af 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem 1rem;
        }
        .login-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            width: 100%;
            max-width: 440px;
        }
        .login-header {
            background: #0b1f42;
            color: #ffffff;
            padding: 2.2rem 2rem 1.8rem;
            text-align: center;
        }
        .login-alert {
            border-radius: 8px;
            margin-bottom: 1.25rem !important;
            padding: 0.75rem 1rem;
            font-size: 0.88rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-header">
        <div class="d-inline-flex p-3 rounded-circle bg-primary bg-opacity-25 mb-3">
            <i class="bi bi-grid-3x3-gap-fill text-info fs-1"></i>
        </div>
        <h4 class="fw-bold m-0 tracking-wide">SMART EXAM SEAT</h4>
        <small class="text-white-50">Smart Exam Hall Seating Arrangement System</small>
    </div>

    <div class="p-4">
        <!-- Error / Logout messages (dismissible and properly spaced) -->
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show login-alert login-alert-box" role="alert">
            <div class="d-flex align-items-center">
                <i class="bi bi-exclamation-triangle-fill text-danger me-2 fs-5"></i>
                <span th:text="${errorMessage}">Invalid credentials</span>
            </div>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div th:if="${logoutMessage}" class="alert alert-success alert-dismissible fade show login-alert login-alert-box" role="alert">
            <div class="d-flex align-items-center">
                <i class="bi bi-check-circle-fill text-success me-2 fs-5"></i>
                <span th:text="${logoutMessage}">Logged out successfully</span>
            </div>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <form id="loginForm" th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label small fw-semibold text-muted d-block mb-1">USERNAME OR REGISTER NUMBER</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-secondary"></i></span>
                    <input type="text" class="form-control border-start-0 ps-0" id="username" name="username" placeholder="e.g. admin, invigilator ID, or register no." required autofocus autocomplete="username">
                </div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label small fw-semibold text-muted d-block mb-1">PASSWORD</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-secondary"></i></span>
                    <input type="password" class="form-control border-start-0 border-end-0 ps-0" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
                    <button class="btn btn-outline-secondary border-start-0" type="button" onclick="togglePasswordVisibility()" title="Toggle password view">
                        <i id="passwordToggleIcon" class="bi bi-eye"></i>
                    </button>
                </div>
            </div>

            <div class="d-grid mt-4">
                <button type="submit" id="submitLoginBtn" class="btn btn-primary btn-lg fw-semibold fs-6 py-2 shadow-sm">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Secure Sign In
                </button>
            </div>
        </form>

        <!-- Quick 1-Click Role Login for Demo -->
        <div class="position-relative my-4 text-center">
            <hr class="text-secondary opacity-25 m-0">
            <span class="position-absolute top-50 start-50 translate-middle bg-white px-3 text-muted small fw-bold" style="font-size: 0.72rem; letter-spacing: 0.05em;">OR QUICK ROLE LOGIN</span>
        </div>

        <div class="d-grid gap-2">
            <button type="button" id="loginStudentBtn" class="btn btn-outline-success d-flex align-items-center justify-content-between py-2 px-3 fw-semibold shadow-sm" onclick="quickLogin('2024cse001', '2024cse001')">
                <span class="d-flex align-items-center">
                    <i class="bi bi-mortarboard-fill me-2 fs-5 text-success"></i> Login as Student
                </span>
                <span class="badge bg-success bg-opacity-10 text-success border border-success border-opacity-25">Student</span>
            </button>

            <button type="button" id="loginAdminBtn" class="btn btn-outline-primary d-flex align-items-center justify-content-between py-2 px-3 fw-semibold shadow-sm" onclick="quickLogin('admin', 'admin123')">
                <span class="d-flex align-items-center">
                    <i class="bi bi-shield-lock-fill me-2 fs-5 text-primary"></i> Login as Admin
                </span>
                <span class="badge bg-primary bg-opacity-10 text-primary border border-primary border-opacity-25">Admin</span>
            </button>

            <button type="button" id="loginInvigilatorBtn" class="btn btn-outline-info d-flex align-items-center justify-content-between py-2 px-3 fw-semibold shadow-sm text-dark" onclick="quickLogin('ramesh.sharma@college.edu', 'invigilator123')">
                <span class="d-flex align-items-center">
                    <i class="bi bi-person-badge-fill me-2 fs-5 text-info"></i> Login as Invigilator
                </span>
                <span class="badge bg-info bg-opacity-10 text-info border border-info border-opacity-25">Invigilator</span>
            </button>
        </div>

        <div class="text-center mt-4 text-muted small">
            Autonomous Examination Cell &bull; Confidential
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function quickLogin(username, password) {
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const form = document.getElementById('loginForm');
        usernameInput.value = username;
        passwordInput.value = password;
        usernameInput.dispatchEvent(new Event('input', { bubbles: true }));
        usernameInput.dispatchEvent(new Event('change', { bubbles: true }));
        passwordInput.dispatchEvent(new Event('input', { bubbles: true }));
        passwordInput.dispatchEvent(new Event('change', { bubbles: true }));
        form.submit();
    }

    function togglePasswordVisibility() {
        const passwordInput = document.getElementById('password');
        const icon = document.getElementById('passwordToggleIcon');
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            icon.classList.remove('bi-eye');
            icon.classList.add('bi-eye-slash');
        } else {
            passwordInput.type = 'password';
            icon.classList.remove('bi-eye-slash');
            icon.classList.add('bi-eye');
        }
    }

    // Dismiss alert when user interacts or automatically after 4 seconds
    document.addEventListener("DOMContentLoaded", function() {
        const form = document.getElementById('loginForm');
        if (form) {
            form.addEventListener('submit', function() {
                const u = document.getElementById('username');
                if (u && u.value) u.value = u.value.trim();
            });
        }

        const alertBoxes = document.querySelectorAll('.login-alert-box');
        if (alertBoxes.length > 0) {
            // Clean up URL query parameters so refreshing doesn't keep showing the message
            if (window.history && window.history.replaceState && window.location.search) {
                window.history.replaceState({}, document.title, window.location.pathname);
            }

            // Auto-fade after 4 seconds
            setTimeout(function() {
                alertBoxes.forEach(function(box) {
                    try {
                        const bsAlert = bootstrap.Alert.getOrCreateInstance(box);
                        if (bsAlert) bsAlert.close();
                    } catch(e) {
                        box.style.display = 'none';
                    }
                });
            }, 4000);

            // Close immediately if user starts typing
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const dismissAll = function() {
                alertBoxes.forEach(function(box) {
                    try {
                        const bsAlert = bootstrap.Alert.getOrCreateInstance(box);
                        if (bsAlert) bsAlert.close();
                    } catch(e) {
                        box.style.display = 'none';
                    }
                });
            };
            if (usernameInput) usernameInput.addEventListener('input', dismissAll, { once: true });
            if (passwordInput) passwordInput.addEventListener('input', dismissAll, { once: true });
        }
    });
</script>
</body>
</html>
