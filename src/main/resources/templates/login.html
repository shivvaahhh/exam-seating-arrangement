<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SMART EXAM SEAT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body {
            background: linear-gradient(135deg, #0f2b5c 0%, #1e3a8a 50%, #1e40af 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            width: 100%;
            max-width: 440px;
        }
        .login-header {
            background: #0b1f42;
            color: #ffffff;
            padding: 2.2rem 2rem 1.8rem;
            text-align: center;
        }
        .demo-credentials-box {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 0.82rem;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-header">
        <div class="d-inline-flex p-3 rounded-circle bg-primary bg-opacity-25 mb-3">
            <i class="bi bi-grid-3x3-gap-fill text-info fs-1"></i>
        </div>
        <h4 class="fw-bold m-0 tracking-wide">SMART EXAM SEAT</h4>
        <small class="text-white-50">Smart Exam Hall Seating Arrangement System</small>
    </div>

    <div class="p-4">
        <!-- Error / Logout messages -->
        <div th:if="${errorMessage}" class="alert alert-danger py-2 small" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-1"></i>
            <span th:text="${errorMessage}">Invalid credentials</span>
        </div>
        <div th:if="${logoutMessage}" class="alert alert-success py-2 small" role="alert">
            <i class="bi bi-check-circle-fill me-1"></i>
            <span th:text="${logoutMessage}">Logged out</span>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label small fw-semibold text-muted">USERNAME or REGISTER NUMBER</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-secondary"></i></span>
                    <input type="text" class="form-control border-start-0 ps-0" id="username" name="username" placeholder="e.g. admin or 2024cse001" required autofocus>
                </div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label small fw-semibold text-muted">PASSWORD</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-secondary"></i></span>
                    <input type="password" class="form-control border-start-0 ps-0" id="password" name="password" placeholder="Enter your password" required>
                </div>
            </div>

            <div class="d-grid mt-4">
                <button type="submit" class="btn btn-primary btn-lg fw-semibold fs-6 py-2">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Secure Sign In
                </button>
            </div>
        </form>

        <!-- Quick Demo Credentials for evaluation -->
        <div class="demo-credentials-box p-3 mt-4">
            <div class="fw-bold text-dark mb-1"><i class="bi bi-key-fill text-warning me-1"></i> Demo Credentials:</div>
            <div class="row g-2 text-muted">
                <div class="col-6">
                    <strong>Admin:</strong><br>
                    User: <code>admin</code><br>
                    Pass: <code>admin123</code>
                </div>
                <div class="col-6">
                    <strong>Student:</strong><br>
                    User: <code>student</code><br>
                    Pass: <code>student123</code>
                </div>
            </div>
        </div>

        <div class="text-center mt-3 text-muted small">
            Autonomous Examination Cell &bull; Confidential
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
